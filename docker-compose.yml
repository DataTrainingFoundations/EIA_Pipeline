services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  ingestion:
    build:
      context: .
      dockerfile: pipeline/ingestion/Dockerfile
    environment:
      EIA_API_KEY: ${EIA_API_KEY}
      PYTHONPATH: /app
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
    volumes:
      - ./pipeline:/app/pipeline

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >
        airflow db migrate &&
        airflow users create
        --role Admin
        --username admin
        --password admin
        --firstname Admin
        --lastname User
        --email admin@example.com ||
        airflow users reset-password
        --username admin
        --password admin;
        (
          sleep 30 &&
          airflow dags unpause eia_hourly_ingest &&
          airflow dags unpause eia_hourly_transform &&
          airflow dags unpause eia_monthly_ingest &&
          airflow dags unpause eia_monthly_transform &&
          if ! airflow dags list-runs -d eia_hourly_ingest --no-backfill | grep -q "eia_hourly_ingest"; then
            airflow dags trigger eia_hourly_ingest;
          fi &&
          if ! airflow dags list-runs -d eia_monthly_ingest --no-backfill | grep -q "eia_monthly_ingest"; then
            airflow dags trigger eia_monthly_ingest;
          fi
        ) &
        airflow scheduler &
        exec airflow webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      PYTHONPATH: /opt/airflow
      _AIRFLOW_WWW_USER_CREATE: ${AIRFLOW_WWW_USER_CREATE}
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_USER_PASSWORD}
      EIA_API_KEY: ${EIA_API_KEY}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      DBT_SNOWFLAKE_ACCOUNT: ${DBT_SNOWFLAKE_ACCOUNT}
      DBT_SNOWFLAKE_USER: ${DBT_SNOWFLAKE_USER}
      DBT_SNOWFLAKE_PASSWORD: ${DBT_SNOWFLAKE_PASSWORD}
      DBT_SNOWFLAKE_ROLE: ${DBT_SNOWFLAKE_ROLE:-SYSADMIN}
      DBT_SNOWFLAKE_WAREHOUSE: ${DBT_SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
      DBT_SNOWFLAKE_DATABASE: ${DBT_SNOWFLAKE_DATABASE:-EIA_PIPELINE}
      DBT_SNOWFLAKE_SCHEMA: ${DBT_SNOWFLAKE_SCHEMA:-GOLD}
      DBT_TARGET: ${DBT_TARGET:-default}
      DBT_THREADS: ${DBT_THREADS:-4}
      DBT_PROJECT_DIR: ${DBT_PROJECT_DIR:-/opt/airflow/warehouse/dbt}
      DBT_PROFILES_DIR: ${DBT_PROFILES_DIR:-}
    ports:
      - "28080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./warehouse:/opt/airflow/warehouse
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      PYTHONPATH: /app
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_APP_SCHEMA: ${SNOWFLAKE_APP_SCHEMA}
    ports:
      - "28501:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./app:/app
      - ./pipeline:/app/pipeline

volumes:
  airflow-postgres-data:
