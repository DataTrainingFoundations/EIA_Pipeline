datasets:
  - id: electricity_generation_hourly
    name: "Electricity Generation by Source (Hourly)"
    snowflake_table: ELECTRICITY_GENERATION_RAW
    eia_route: "electricity/rto/fuel-type-data"
    frequency: "hourly"
    rolling_days: 7
    params:
      frequency: hourly
      data:
        - value
      facets:
        fueltype:
          - NG
          - COL
          - NUC
          - WND
          - SUN
          - WAT
      sort:
        - column: period
          direction: desc
      length: 500
    schema:
      period: string
      respondent: string
      respondent-name: string
      fueltype: string
      type-name: string
      value: float
      value-units: string

  - id: electricity_demand_hourly
    name: "Electricity Demand by Region (Hourly)"
    snowflake_table: ELECTRICITY_DEMAND_RAW
    eia_route: "electricity/rto/region-data"
    frequency: "hourly"
    rolling_days: 7
    params:
      frequency: hourly
      data:
        - value
      facets:
        type:
          - D
          - DF
      sort:
        - column: period
          direction: desc
      length: 500
    schema:
      period: string
      respondent: string
      respondent-name: string
      type: string
      type-name: string
      value: float
      value-units: string
