datasets:
  - id: electricity_generation_hourly
    name: "Electricity Generation by Source (Hourly)"
    snowflake_table: ELECTRICITY_GENERATION_RAW
    eia_route: "electricity/rto/fuel-type-data"
    frequency: "hourly"
    cadence_group: "hourly"
    transform_enabled: true
    bootstrap_enabled: true
    bootstrap_start_date: "2025-01-01"
    bootstrap_max_partitions_per_run: 90
    bootstrap_priority: "latest_first"
    scheduled_ingest: true
    scheduled_transform: true
    repair_lookback_partitions: 7
    max_partitions_per_run: 14
    rolling_days: 7
    chunk_days: 7
    params:
      frequency: hourly
      data:
        - value
      facets:
        fueltype:
          - NG
          - COL
          - NUC
          - WND
          - SUN
          - WAT
      sort:
        - column: period
          direction: desc
      length: 500
    schema:
      period: string
      respondent: string
      respondent-name: string
      fueltype: string
      type-name: string
      value: float
      value-units: string

  - id: electricity_demand_hourly
    name: "Electricity Demand by Region (Hourly)"
    snowflake_table: ELECTRICITY_DEMAND_RAW
    eia_route: "electricity/rto/region-data"
    frequency: "hourly"
    cadence_group: "hourly"
    transform_enabled: true
    bootstrap_enabled: true
    bootstrap_start_date: "2025-01-01"
    bootstrap_max_partitions_per_run: 90
    bootstrap_priority: "latest_first"
    scheduled_ingest: true
    scheduled_transform: true
    repair_lookback_partitions: 7
    max_partitions_per_run: 14
    rolling_days: 7
    chunk_days: 7
    params:
      frequency: hourly
      data:
        - value
      facets:
        type:
          - D
          - DF
      sort:
        - column: period
          direction: desc
      length: 5000
    schema:
      period: string
      respondent: string
      respondent-name: string
      type: string
      type-name: string
      value: float
      value-units: string

  - id: electricity_retail_sales_monthly
    name: "Electricity Retail Sales to Ultimate Customer (Monthly)"
    snowflake_table: ELECTRICITY_RETAIL_SALES_RAW
    eia_route: "electricity/retail-sales/data"
    frequency: "monthly"
    cadence_group: "monthly"
    transform_enabled: true
    bootstrap_enabled: true
    bootstrap_start_date: "2023-01-01"
    bootstrap_max_partitions_per_run: 36
    bootstrap_priority: "latest_first"
    scheduled_ingest: true
    scheduled_transform: true
    repair_lookback_partitions: 3
    max_partitions_per_run: 12
    rolling_months: 24
    chunk_months: 12
    params:
      frequency: monthly
      data:
        - customers
        - price
        - revenue
        - sales
      facets: {}
      sort:
        - column: period
          direction: desc
      length: 5000
    schema:
      period: string
      stateid: string
      stateDescription: string
      sectorid: string
      sectorName: string
      customers: float
      price: float
      revenue: float
      sales: float

  - id: electricity_power_operational_data_monthly
    name: "Electric Power Operational Data (Monthly)"
    snowflake_table: ELECTRICITY_POWER_OPERATIONAL_RAW
    eia_route: "electricity/electric-power-operational-data"
