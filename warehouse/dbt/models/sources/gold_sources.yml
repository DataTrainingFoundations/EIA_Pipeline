version: 2

sources:
  - name: gold
    description: Curated Snowflake gold serving tables.
    database: "{{ env_var('DBT_SNOWFLAKE_DATABASE', env_var('SNOWFLAKE_DATABASE', 'EIA_PIPELINE')) }}"
    schema: GOLD
    tables:
      - name: FACT_GENERATION_HOURLY
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [record_id]
              config:
                tags: ["hourly_gold", "hourly_generation"]
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [period_ts, ba_code, fuel_code, partition_date]
              config:
                tags: ["hourly_gold", "hourly_generation"]
        columns:
          - name: record_id
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_generation"]
          - name: period_ts
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_generation"]
          - name: ba_code
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_generation"]
          - name: fuel_code
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_generation"]
          - name: partition_date
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_generation"]
          - name: generation_gwh
            tests:
              - non_negative:
                  config:
                    tags: ["hourly_gold", "hourly_generation"]
      - name: FACT_DEMAND_HOURLY
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [record_id]
              config:
                tags: ["hourly_gold", "hourly_demand"]
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [period_ts, ba_code, partition_date]
              config:
                tags: ["hourly_gold", "hourly_demand"]
        columns:
          - name: record_id
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_demand"]
          - name: period_ts
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_demand"]
          - name: ba_code
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_demand"]
          - name: partition_date
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_demand"]
          - name: demand_gwh
            tests:
              - non_negative:
                  config:
                    tags: ["hourly_gold", "hourly_demand"]
          - name: forecast_gwh
            tests:
              - non_negative:
                  config:
                    severity: warn
                    where: "forecast_gwh is not null"
                    tags: ["hourly_gold", "hourly_demand"]
      - name: AGG_DAILY_GENERATION
        columns:
          - name: partition_date
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_generation"]
          - name: total_gwh
            tests:
              - non_negative:
                  config:
                    tags: ["hourly_gold", "hourly_generation"]
      - name: AGG_DAILY_DEMAND_PEAK
        columns:
          - name: partition_date
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_demand"]
          - name: peak_gwh
            tests:
              - non_negative:
                  config:
                    tags: ["hourly_gold", "hourly_demand"]
      - name: DIM_BALANCING_AUTHORITY
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [ba_code]
              config:
                tags: ["hourly_gold", "hourly_generation", "hourly_demand"]
        columns:
          - name: ba_code
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_generation", "hourly_demand"]
      - name: DIM_FUEL_TYPE
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [fuel_code]
              config:
                tags: ["hourly_gold", "hourly_generation"]
        columns:
          - name: fuel_code
            tests:
              - not_null:
                  config:
                    tags: ["hourly_gold", "hourly_generation"]
      - name: FACT_SALES_MONTHLY
        description: "Monthly sales fact table"
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [record_id]  # if record_id exists, else use PERIOD+STATE_ID+SECTOR_ABBR+PERIOD
              config:
                tags: ["monthly_gold", "monthly_operational_sales"]
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [PERIOD, STATE_ID, SECTOR_ABBR]
              config:
                tags: ["monthly_gold", "monthly_operational_sales"]
        columns:
          - name: PERIOD
            tests:
              - not_null:
                  config:
                    tags: ["monthly_gold", "monthly_operational_sales"]
          - name: STATE_ID
            tests:
              - not_null:
                  config:
                    tags: ["monthly_gold", "monthly_operational_sales"]
          - name: STATE_DESCRIPTION
            tests: []
          - name: SECTOR_ABBR
            tests:
              - not_null:
                  config:
                    tags: ["monthly_gold", "monthly_operational_sales"]
          - name: SECTOR_NAME
            tests: []
          - name: CUSTOMERS
            tests:
              - non_negative:
                  config:
                    severity: warn
                    where: "CUSTOMERS is not null"
                    tags: ["monthly_gold", "monthly_operational_sales"]
          - name: AVG_PRICE
            tests:
              - non_negative:
                  config:
                    severity: warn
                    where: "AVG_PRICE is not null"
                    tags: ["monthly_gold", "monthly_operational_sales"]
          - name: REVENUE
            tests:
              - non_negative:
                  config:
                    severity: warn
                    where: "REVENUE is not null"
                    tags: ["monthly_gold", "monthly_operational_sales"]
          - name: RETAIL_SALES_MWH
            tests:
              - non_negative:
                  config:
                    severity: warn
                    where: "RETAIL_SALES_MWH is not null"
                    tags: ["monthly_gold", "monthly_operational_sales"]
          - name: GOLD_PROCESSED_AT
            tests: []
